name: Dependency updates

# Ежедневная сверка запиненных зависимостей с апстримом (@opencode/cli,
# @grinev/opencode-telegram-bot, yo-urun/opencode-graphiti-extractor).
# Расхождение -> отдельный PR в develop. Логика: scripts/deps-bump.sh.
# Ручной запуск: Actions -> Dependency updates -> Run workflow (там же --dry-run не нужен:
# для просмотра расхождений без PR запустите скрипт локально с --dry-run).

on:
  schedule:
    - cron: "23 5 * * *" # ежедневно, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check pins and open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: develop
        run: bash scripts/deps-bump.sh
