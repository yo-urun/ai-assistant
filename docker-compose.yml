name: ai-assistant

services:
  # ------------------------------------------------------------------
  #  OpenCode V2 — ядро агента (провайдеры, сессии, MCP, права).
  #  Собирается из ./opencode (Node + @opencode/cli).
  # ------------------------------------------------------------------
  opencode:
    build:
      context: ./opencode
      args:
        # Версию фонового экстрактора можно переопределить без правки Dockerfile.
        EXTRACTOR_REF: ${EXTRACTOR_REF:-v0.5.0}
    image: ${OPENCODE_IMAGE:-opencode-v2:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      # Дешёвая модель для сводок компакции. Пусто → модель сессии
      # (OPENCODE_MODEL_PROVIDER/OPENCODE_MODEL_ID): так пустая строка в
      # agents.compaction.model не ломает резолв и не ссылается на
      # неподключённого провайдера. Своя модель — provider/model.
      OPENCODE_SMALL_MODEL: ${OPENCODE_SMALL_MODEL:-${OPENCODE_MODEL_PROVIDER:-openai}/${OPENCODE_MODEL_ID:-gpt-4o-mini}}
      # Фоновый экстрактор памяти: куда писать и в какую группу графа.
      GRAPHITI_URL: ${GRAPHITI_URL:-http://graphiti:8000/mcp?codemode=false}
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-opencode}
      # Батчинг и сжатие эпизодов — главный рычаг расхода на экстракции
      # (Graphiti не кэширует промпты). См. docs/token-budget.md.
      GRAPHITI_DEBOUNCE_MS: ${GRAPHITI_DEBOUNCE_MS:-180000}
      GRAPHITI_MIN_TURNS: ${GRAPHITI_MIN_TURNS:-4}
      GRAPHITI_MIN_CHARS: ${GRAPHITI_MIN_CHARS:-400}
      GRAPHITI_MAX_CHARS: ${GRAPHITI_MAX_CHARS:-12000}
      GRAPHITI_PER_TURN_MAX: ${GRAPHITI_PER_TURN_MAX:-900}
      GRAPHITI_ASSISTANT_MAX: ${GRAPHITI_ASSISTANT_MAX:-400}
      GRAPHITI_MIN_TURN_CHARS: ${GRAPHITI_MIN_TURN_CHARS:-16}
      GRAPHITI_SEARCH_TOP_K: ${GRAPHITI_SEARCH_TOP_K:-5}
      GRAPHITI_SEARCH_MAX_CHARS: ${GRAPHITI_SEARCH_MAX_CHARS:-2000}
      # Самоорганизация памяти (нужен экстрактор v0.4.0+, см. docs/memory.md):
      #  - UPDATE_COMMUNITIES: инкрементальные кластеры при ingest (сейчас ВЫКЛ:
      #    известный баг Graphiti — build/update communities вешает MCP-сервер в
      #    контейнере, getzep/graphiti#450);
      #  - ORGANIZE_EVERY_HOURS: периодическая перестройка кластеров (0 — выкл.);
      #  - SAGA_SCOPE: session | project — уровень саг (нить повествования);
      #  - EXTRACTION_INSTRUCTIONS: правила каноничного извлечения сущностей.
      GRAPHITI_UPDATE_COMMUNITIES: ${GRAPHITI_UPDATE_COMMUNITIES:-false}
      GRAPHITI_ORGANIZE_EVERY_HOURS: ${GRAPHITI_ORGANIZE_EVERY_HOURS:-0}
      GRAPHITI_SAGA_SCOPE: ${GRAPHITI_SAGA_SCOPE:-session}
      GRAPHITI_EXTRACTION_INSTRUCTIONS: ${GRAPHITI_EXTRACTION_INSTRUCTIONS:-Use canonical entity names (one real-world object = one node). Prefer specific, typed relations; avoid vague Topic/Object when a precise name exists. Do not duplicate facts already in the graph.}
      # Опциональный recall: инъекция памяти в контекст перед вызовом модели.
      # off (по умолчанию) — ноль лишних токенов/задержек; start/turn включают.
      GRAPHITI_RECALL: ${GRAPHITI_RECALL:-off}
      GRAPHITI_RECALL_MAX_FACTS: ${GRAPHITI_RECALL_MAX_FACTS:-5}
      GRAPHITI_RECALL_MAX_CHARS: ${GRAPHITI_RECALL_MAX_CHARS:-1200}
      GRAPHITI_RECALL_TIMEOUT_MS: ${GRAPHITI_RECALL_TIMEOUT_MS:-800}
      # Общий ключ Google Developers API (см. .env.example).
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    # Ollama на хосте: из контейнера он доступен как host.docker.internal
    # (на Linux без этой строки имя не резолвится).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace
    volumes:
      # Конфиг агента: модель, права, MCP graphiti. Правьте и перезапускайте.
      # OPENCODE_CONFIG_FILE переключает файл на сгенерированный мастером
      # (opencode.local.jsonc) для Ollama или своего OpenAI-совместимого endpoint.
      - ./opencode/${OPENCODE_CONFIG_FILE:-opencode.jsonc}:/root/.config/opencode/opencode.jsonc:ro
      # Состояние OpenCode: БД сессий и пр.
      - opencode_data:/root/.local/share/opencode
      # Рабочая папка агента.
      - workspace:/workspace
    healthcheck:
      # Проверяем, что сервер слушает порт (без авторизации — достаточно TCP).
      test: ["CMD", "node", "-e", "const net=require('net');const s=net.connect(49374,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Порт наружу не публикуем: бот ходит к opencode по внутренней сети compose.
    # Если нужен доступ с хоста — раскомментируйте (следите за конфликтом портов):
    # ports:
    #   - "127.0.0.1:49374:49374"

  # ------------------------------------------------------------------
  #  Telegram-бот (grinev/opencode-telegram-bot, MIT).
  #  Тонкий мост к OpenCode: сессии, голос (STT), файлы, команды.
  # ------------------------------------------------------------------
  bot:
    build:
      context: ./bot
    image: ${BOT_IMAGE:-opencode-telegram-bot:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /data
      OPENCODE_TELEGRAM_CONTAINER: "1"
    volumes:
      - bot_data:/data
    depends_on:
      opencode:
        condition: service_healthy

  # ------------------------------------------------------------------
  #  Graphiti MCP: долговременная память агента. Укажите свой образ.
  #  Включается профилем compose "memory" (см. COMPOSE_PROFILES в .env).
  # ------------------------------------------------------------------
  graphiti:
    image: ${GRAPHITI_IMAGE}
    restart: unless-stopped
    profiles: ["memory"]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD}
      # Graphiti использует LLM для извлечения/эмбеддингов/реранкера.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Именно OPENAI_API_URL (а не OPENAI_BASE_URL) читает config.yaml Graphiti.
      OPENAI_API_URL: ${OPENAI_API_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
      # Извлечение сущностей идёт без prompt cache, поэтому модель должна быть
      # дешёвой. Reasoning-модель здесь не нужна.
      MODEL_NAME: ${GRAPHITI_MODEL:-gpt-4o-mini}
      EMBEDDER_MODEL: ${GRAPHITI_EMBEDDER_MODEL:-text-embedding-3-small}
      # Меньше параллельных эпизодов = меньше пиков и 429; на цену за токен
      # не влияет, но делает расход предсказуемым.
      SEMAPHORE_LIMIT: ${GRAPHITI_SEMAPHORE_LIMIT:-2}
      GRAPHITI_TELEMETRY_ENABLED: "false"
    depends_on:
      falkordb:
        condition: service_healthy

  # ------------------------------------------------------------------
  #  FalkorDB: графовая база для памяти.
  # ------------------------------------------------------------------
  falkordb:
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:latest}
    restart: unless-stopped
    profiles: ["memory"]
    environment:
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD}
    command: ["redis-server", "--requirepass", "${FALKORDB_PASSWORD}"]
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$FALKORDB_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  bot_data:
  opencode_data:
  falkordb_data:
  workspace:
